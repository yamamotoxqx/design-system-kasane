<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kasane ドキュメント</title>
<script>
/* Apply the saved palette and theme before first paint (no flash). */
try{var a=localStorage.getItem('kasane-accent'),t=localStorage.getItem('kasane-theme');if(a)document.documentElement.dataset.accent=a;if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;}catch(e){}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!--@@HEADLINKS@@-->
<style>
/* ============ 0. LINE Seed JP (subset, embedded for this page) ============ */
/*@@FONTS@@*/

/* ============ 1. Palettes (embedded build only) ============ */
/*@@PALETTES@@*/

/* ============ 2. Components (embedded build only) ============ */
/*@@COMPONENTS@@*/

/* ============ 3. Documentation site ============ */
/* Layout: header with section nav on top; sidebar | main | on-this-page; link footer with the theme switch.
   Under 1100px the on-this-page column hides; under 820px the sidebar becomes a drawer. */
:root{--header-h:60px;--side-w:248px;--toc-w:216px}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(var(--header-h) + 16px)}
body{-webkit-font-smoothing:antialiased}
h1,h2,h3,p,ul,figure{margin:0}
h1,h2,h3{text-wrap:balance;line-height:1.4}
a{color:inherit}
button{font:inherit;color:inherit}
code{font-family:var(--font-mono);font-size:.875em;background:var(--surface-2);border-radius:6px;padding:1px 6px}
[hidden]{display:none!important}
.brand,.page-head h1,.sec h2,.hero h1,.dialog h2{font-family:var(--font-title);font-weight:900;line-height:1.3}
.num-tag,.sw,.pager small,.type-row small{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.ex-demo .k-toast{position:static;transform:none}
.k-scrim{z-index:60}

/* Header */
.header{position:sticky;top:0;z-index:30;height:var(--header-h);background:var(--bg);display:flex;align-items:center;gap:12px;padding:0 16px}
.brand{display:flex;align-items:center;gap:10px;font-size:20px;text-decoration:none;margin-right:12px}
.brand svg{width:28px;height:28px;flex:none}
.topnav{display:flex;gap:2px}
.topnav a{display:flex;align-items:center;min-height:40px;padding:0 14px;border-radius:999px;text-decoration:none;font-weight:700;font-size:15px;color:var(--muted)}
.topnav a:hover{background:var(--surface-2);color:var(--ink)}
.topnav a[aria-current="true"]{background:var(--surface);color:var(--ink)}
.space{flex:1}
.menu-btn{display:none;width:44px;height:44px;border:0;border-radius:999px;background:var(--surface-2);cursor:pointer;place-items:center;flex:none}
.menu-btn svg{width:22px;height:22px}
.color-btn{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 16px 0 10px;border:0;border-radius:999px;background:var(--surface-2);font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap}
.color-btn:hover{background:var(--surface-3)}
.color-btn i{display:block;width:22px;height:22px;border-radius:50%;background:var(--accent)}

/* Shell */
.shell{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr) var(--toc-w);gap:24px;max-width:1360px;margin:0 auto;padding:8px 16px 56px;align-items:start}
.shell.is-home{grid-template-columns:minmax(0,1fr);max-width:960px}
.shell.is-home .sidebar,.shell.is-home .toc{display:none}
.sidebar,.toc{position:sticky;top:calc(var(--header-h) + 8px);max-height:calc(100vh - var(--header-h) - 24px);overflow-y:auto}
.sidebar{display:flex;flex-direction:column;gap:20px;padding:8px 4px}
.nav-group{display:none;flex-direction:column;gap:2px}
.nav-group.current{display:flex}
.nav-title{font-size:12px;font-weight:700;color:var(--muted);padding:0 12px 4px}
.nav-link{display:flex;align-items:center;min-height:40px;padding:0 12px;border-radius:12px;text-decoration:none;font-size:15px;font-weight:700}
.nav-link:hover{background:var(--surface-2)}
.nav-link[aria-current="page"]{background:var(--accent-soft);color:var(--accent-ink)}
.drawer-scrim{display:none}

.main{background:var(--surface);border-radius:var(--r-lg);padding:clamp(20px,5vw,48px);min-width:0}
.page{display:flex;flex-direction:column;gap:48px}
.page:not([hidden]),.pager{animation:k-enter var(--motion-slow) var(--ease-out)}
@media (prefers-reduced-motion:reduce){.page:not([hidden]),.pager{animation:none}}
.crumbs{font-size:13px;color:var(--muted);font-weight:700}
.page-head{display:flex;flex-direction:column;gap:12px}
.page-head h1{font-size:clamp(28px,6vw,40px)}
.lead{font-size:17px;color:var(--muted);max-width:36em}
.sec{display:flex;flex-direction:column;gap:16px;scroll-margin-top:calc(var(--header-h) + 16px)}
.sec h2{font-size:24px;display:flex;align-items:center;gap:12px}
.sec>p{max-width:38em}
.sec a,.links a{color:var(--accent-ink);font-weight:700;text-underline-offset:3px}
.a-ink{color:var(--accent-ink);font-weight:700;text-decoration:underline;text-underline-offset:3px}

.toc{display:flex;flex-direction:column;gap:4px;padding:8px 4px;font-size:14px}
.toc-title{font-size:12px;font-weight:700;color:var(--muted);padding:0 12px 4px}
.toc button{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 12px;border-radius:10px;color:var(--muted);font-weight:700;line-height:1.5;cursor:pointer}
.toc button:hover,.toc button[aria-current="true"]{background:var(--surface-2);color:var(--ink)}

/* Pager */
.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:48px}
.pager a{display:flex;flex-direction:column;background:var(--surface-2);border-radius:var(--r-md);padding:14px 18px;text-decoration:none;font-weight:800;line-height:1.5}
.pager a:hover{background:var(--surface-3)}
.pager small{font-weight:700;color:var(--muted);font-size:12px}
.pager .next{grid-column:2;text-align:right}

/* Tiles and principle cards */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}
.cards.two{grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))}
.tile{display:flex;flex-direction:column;gap:8px;background:var(--surface-2);border-radius:var(--r-md);padding:20px;text-align:left;border:0;text-decoration:none}
.tile h3{font-size:18px;font-weight:800}
.tile p{font-size:15px;color:var(--muted)}
.tile-link{cursor:pointer}
.tile-link:hover{background:var(--surface-3)}
.num-tag{display:inline-grid;place-items:center;flex:none;width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.links{list-style:none;padding:0;display:flex;flex-direction:column;gap:6px}
.links li{display:flex;flex-wrap:wrap;gap:4px 16px;background:var(--surface-2);border-radius:var(--r-md);padding:12px 16px}
.links span{color:var(--muted);font-size:15px}

/* Example (live demo + code) */
.ex{display:flex;flex-direction:column;gap:8px}
.ex-demo{background:var(--bg);border-radius:var(--r-md);padding:28px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center}
.ex-demo.ex-stack{flex-direction:column;align-items:stretch;max-width:100%}
.ex-demo.ex-stack>*{width:100%;max-width:420px;margin:0 auto}
.code{background:var(--surface-2);border-radius:var(--r-md);overflow:hidden}
.code-head{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 0 16px;font-size:12px;font-weight:700;color:var(--muted)}
.copy{border:0;background:transparent;border-radius:999px;min-height:32px;padding:0 12px;font-size:13px;font-weight:700;color:var(--accent-ink);cursor:pointer}
.copy:hover{background:var(--surface-3)}
pre{margin:0;padding:8px 16px 16px;overflow-x:auto;font-size:13px;line-height:1.7}
pre code{background:none;padding:0;font-size:inherit}

/* Do / Don't */
.dd{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));grid-auto-rows:auto;gap:16px}
.dd-item{display:grid;grid-template-rows:subgrid;grid-row:span 2;row-gap:0;border:2px solid var(--dd-color);border-radius:20px;overflow:hidden}
.dd-do{--dd-color:var(--ok);--dd-soft:var(--ok-soft)}
.dd-dont{--dd-color:var(--danger);--dd-soft:var(--danger-soft)}
.dd-demo{flex:1;min-height:160px;background:var(--bg);padding:20px;display:grid;place-items:center}
.dd-cap{padding:14px 18px;background:var(--dd-soft);font-size:14px;line-height:1.7}
.dd-label{display:flex;align-items:center;gap:6px;margin-bottom:4px;color:var(--dd-color);font-weight:800;font-size:15px}
.dd-label svg{width:18px;height:18px;flex:none}
.k-card.mini{padding:14px;gap:6px;width:100%;max-width:250px;font-size:14px;border-radius:20px}
.k-card.mini .k-list-item{padding:8px 12px;border-radius:12px}
.stack{display:flex;flex-direction:column;align-items:center;gap:12px}
.inline{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.dot{display:inline-flex;align-items:center;gap:8px;font-size:14px}
.dot i{width:12px;height:12px;border-radius:50%;display:block}

/* Tables */
.tbl{overflow-x:auto}
table{border-collapse:separate;border-spacing:0 4px;width:100%;min-width:520px;font-size:14px}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:700;padding:0 12px 4px}
td{background:var(--surface-2);padding:8px 12px;line-height:1.6}
td:first-child{border-radius:12px 0 0 12px;white-space:nowrap}
td:last-child{border-radius:0 12px 12px 0}
td code{background:var(--surface-3)}
.sw{display:inline-flex;align-items:center;gap:10px;font-size:13px;white-space:nowrap}
.sw i{display:block;width:24px;height:24px;border-radius:8px;flex:none}

/* Palette buttons (colour page and first-visit chooser) */
.pals{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.pal{display:grid;grid-template-columns:auto 1fr;column-gap:10px;align-items:center;text-align:left;border:0;border-radius:var(--r-md);background:var(--surface-2);padding:10px 14px;cursor:pointer;min-height:56px}
.pal:hover{background:var(--surface-3)}
.pal i{grid-row:span 2;display:block;width:30px;height:30px;border-radius:50%}
.pal b{font-size:15px;line-height:1.3}
.pal small{font-size:12px;color:var(--muted);line-height:1.3}
.pal[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.pal[aria-pressed="true"] small{color:inherit;opacity:.75}

/* Style pages */
.layers{border-radius:var(--r-md);padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;font-family:var(--font-mono);font-size:13px}
.L0{background:var(--bg)}.L1{background:var(--surface)}.L2{background:var(--surface-2)}.L3{background:var(--surface-3)}
.type-list{display:flex;flex-direction:column;gap:6px}
.type-row{display:grid;grid-template-columns:130px 1fr auto;gap:8px 16px;align-items:baseline;background:var(--surface-2);border-radius:var(--r-md);padding:12px 16px}
.type-row code{background:var(--surface-3);justify-self:start}
.type-row small{color:var(--muted);font-size:12px;white-space:nowrap}
.numcmp{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.numcmp>div{background:var(--surface-2);border-radius:var(--r-md);padding:12px 16px;display:flex;flex-direction:column;align-items:flex-end;font-size:20px;font-weight:700;line-height:1.7}
.numcmp small{align-self:flex-start;font-size:12px;color:var(--muted)}
.radii{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.radii>div{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.radii i{display:block;width:100%;height:84px;background:var(--surface-2)}
.radii small,.spaces small{color:var(--muted);font-size:13px}
.spaces{display:flex;flex-direction:column;gap:6px}
.spaces>div{display:grid;grid-template-columns:110px 64px 1fr;gap:12px;align-items:center;background:var(--surface-2);border-radius:12px;padding:8px 14px}
.spaces code{background:var(--surface-3);justify-self:start}
.spaces i{display:block;height:16px;background:var(--accent);border-radius:3px}

/* Don't example for motion */
@keyframes bad-wobble{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.bad-motion{animation:bad-wobble .5s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.bad-motion{animation:none}}

/* Site map (about page) */
.site-map{list-style:none;padding:0;display:flex;flex-direction:column;gap:6px}
.site-map a{display:flex;align-items:center;gap:16px;background:var(--surface-2);border-radius:var(--r-md);padding:16px 18px 16px 20px;text-decoration:none;color:var(--ink)}
.site-map a:hover{background:var(--surface-3)}
.site-map a:hover .go{transform:translateX(3px);color:var(--accent-ink)}
.sm-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;line-height:1.6}
.sm-text b{font-size:17px;font-weight:800}
.sm-text span{font-size:14px;color:var(--muted)}
.site-map .go{width:20px;height:20px;flex:none;color:var(--muted);transition:transform var(--motion-fast),color var(--motion-fast)}
@media (prefers-reduced-motion:reduce){.site-map .go{transition:none}}

/* Log, icon grid */
.log{list-style:none;padding:0;display:flex;flex-direction:column;gap:6px}
.log li{display:flex;gap:16px;align-items:baseline;background:var(--surface-2);border-radius:var(--r-md);padding:14px 18px}
.log time{flex:none;font-size:13px;color:var(--muted)}
.log div{display:flex;flex-direction:column;line-height:1.6}
.log span{font-size:14px;color:var(--muted)}
.links li>b{flex:none}
.icon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.icon-grid>div{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--surface-2);border-radius:var(--r-md);padding:16px 8px 10px}
.icon-grid svg{width:28px;height:28px}
.icon-grid small{font-size:12px;color:var(--muted)}
.icon-grid code{font-size:11px;background:none;padding:0;color:var(--muted)}
td svg.lucide{width:20px;height:20px;vertical-align:middle}

/* Home */
.home{gap:32px}
.hero{position:relative;overflow:hidden;background:var(--surface-2);border-radius:var(--r-lg);padding:clamp(28px,6vw,56px);display:flex;flex-direction:column;gap:14px}
.hero h1{font-size:clamp(44px,10vw,80px);line-height:1.1}
.hero .lead{color:var(--ink);font-weight:700}
.hero .start{justify-content:flex-start;margin-top:8px}
.hero-ai{font-size:14px;color:var(--muted)}
.hero-ai a{color:var(--accent-ink);font-weight:700;text-underline-offset:3px}
.hero>*{position:relative}
.hero-art{position:absolute;right:-30px;top:-30px;width:260px;height:260px}
.hero-art i{position:absolute;border-radius:36px;width:150px;height:150px}
.hero-art i:nth-child(1){right:0;top:0;background:var(--accent)}
.hero-art i:nth-child(2){right:60px;top:60px;background:var(--accent-soft)}
.hero-art i:nth-child(3){right:120px;top:120px;background:var(--surface-3)}
a.k-btn{text-decoration:none}

/* Footer */
.footer{background:var(--surface-2);margin-top:8px}
.footer-in{max-width:1360px;margin:0 auto;padding:40px 16px 32px;display:flex;flex-direction:column;gap:28px}
.f-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:24px 16px}
.f-col{display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.f-title{font-size:12px;font-weight:700;color:var(--muted);padding-bottom:6px}
.f-col a{text-decoration:none;font-weight:700;font-size:15px;padding:4px 0}
.f-col a:hover{text-decoration:underline;text-underline-offset:3px}
.f-bottom{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:16px}
.f-brand{font-weight:800}
.f-brand{display:flex;flex-direction:column;gap:4px}
.f-brand small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.f-meta{display:flex;align-items:baseline;gap:6px}
.f-meta a{display:inline-flex;align-items:center;gap:5px;color:inherit;text-decoration:none}
.f-meta svg{width:13px;height:13px;flex:none;align-self:center}
.f-meta a:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.f-theme{display:flex;align-items:center;gap:12px;font-weight:700;font-size:14px}
.footer .k-seg{background:var(--surface-3)}

/* First-visit chooser */
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.5);display:grid;place-items:center;padding:16px;overflow-y:auto}
.dialog{background:var(--surface);border-radius:var(--r-lg);padding:clamp(20px,5vw,32px);width:100%;max-width:560px;display:flex;flex-direction:column;gap:16px}
.dialog h2{font-size:22px}
.dialog p{color:var(--muted);font-size:15px}
.dialog .actions{display:flex;justify-content:flex-end}

/* Responsive */
@media (max-width:1100px){
  .shell{grid-template-columns:var(--side-w) minmax(0,1fr)}
  .toc{display:none}
}
@media (max-width:820px){
  .menu-btn{display:grid}
  .topnav{display:none}
  .brand{margin-right:0}
  .shell{grid-template-columns:minmax(0,1fr)}
  .shell.is-home .sidebar{display:flex}
  .sidebar{position:fixed;z-index:40;top:0;left:0;bottom:0;width:min(84vw,300px);max-height:none;background:var(--surface);padding:20px 12px;border-radius:0 var(--r-lg) var(--r-lg) 0;transform:translateX(-102%);visibility:hidden;transition:transform .2s,visibility .2s}
  .sidebar.open{transform:none;visibility:visible}
  .nav-group{display:flex}
  .drawer-scrim{display:block;position:fixed;inset:0;z-index:35;background:rgba(0,0,0,.45)}
  .type-row{grid-template-columns:1fr}
  .spaces>div{grid-template-columns:100px 64px;}
  .spaces small{grid-column:1 / -1}
  .hero-art{opacity:.5}
}
@media (prefers-reduced-motion:reduce){.sidebar{transition:none}}
</style>
</head>
<body>

<header class="header">
  <button class="menu-btn" type="button" id="menu-btn" aria-label="メニューを開く" aria-expanded="false" aria-controls="sidebar">
    <!--@@ICON:menu@@-->
  </button>
  <a class="brand" href="#home">
    <svg viewBox="0 0 28 28" aria-hidden="true"><rect x="2" y="8" width="18" height="18" rx="6" fill="var(--surface-3)"/><rect x="8" y="2" width="18" height="18" rx="6" fill="var(--accent)"/></svg>
    Kasane
  </a>
  <nav class="topnav" aria-label="セクション"><!--@@TOPNAV@@--></nav>
  <div class="space"></div>
  <button class="color-btn" type="button" data-open-chooser><i aria-hidden="true"></i>色を変える</button>
</header>

<div class="drawer-scrim" id="drawer-scrim" hidden></div>

<div class="shell" id="shell">
  <nav class="sidebar" id="sidebar" aria-label="ページ"><!--@@SIDEBAR@@--></nav>
  <main class="main" id="main">
    <!--@@PAGES@@-->
    <nav class="pager" id="pager" aria-label="前後のページ"></nav>
  </main>
  <aside class="toc" id="toc" aria-label="このページの目次"></aside>
</div>

<footer class="footer">
  <div class="footer-in">
    <div class="f-cols"><!--@@FOOTER@@--></div>
    <div class="f-bottom">
      <div class="f-brand">Kasane<small>面を重ねて区切り、色を選べるデザインシステム</small>
        <small class="f-meta"><a href="https://github.com/yamamotoxqx/design-system-kasane"><!--@@ICON:code@@-->GitHub</a><span aria-hidden="true">・</span>MIT License</small></div>
      <div class="f-theme"><span id="theme-label">テーマ</span>
        <div class="k-seg" role="group" aria-labelledby="theme-label">
          <button type="button" data-theme-set="light" aria-pressed="false">ライト</button>
          <button type="button" data-theme-set="dark" aria-pressed="false">ダーク</button>
        </div>
      </div>
    </div>
  </div>
</footer>

<div class="modal" id="chooser" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="chooser-title">
    <h2 id="chooser-title">アクセントカラーを選ぶ</h2>
    <p>このサイトを、選んだ色で表示します。色はあとからでも、右上の「色を変える」で選び直せます。</p>
    <div class="pals"><!--@@CHOOSER@@--></div>
    <div class="actions"><button class="k-btn k-btn-primary" type="button" id="chooser-ok">この色で始める</button></div>
  </div>
</div>

<script>
(function(){
  var NAV=/*@@NAV@@*/;
  var root=document.documentElement;
  var $=function(id){return document.getElementById(id);};
  var all=function(sel,el){return Array.prototype.slice.call((el||document).querySelectorAll(sel));};
  var store={get:function(k){try{return localStorage.getItem(k);}catch(e){return null;}},set:function(k,v){try{localStorage.setItem(k,v);}catch(e){}}};
  var FLAT=[];NAV.forEach(function(s){s.pages.forEach(function(p){FLAT.push({id:p[0],title:p[1],sec:s.id,secLabel:s.label});});});

  /* ---------- Router (plain #name) ---------- */
  var tocBtns=[],tocSecs=[];
  function route(){
    var id=location.hash.slice(1)||'home';
    var cur=FLAT.filter(function(p){return p.id===id;})[0];
    if(!cur&&id!=='home'){id='home';}
    all('.page').forEach(function(p){p.hidden=true;});
    var shown=document.querySelector('.page[data-page="'+id+'"]');void shown.offsetWidth;shown.hidden=false;
    var pg=$('pager');pg.style.animation='none';void pg.offsetWidth;pg.style.animation='';
    $('shell').classList.toggle('is-home',id==='home');
    all('.nav-link').forEach(function(a){if(a.getAttribute('href')==='#'+id)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
    all('.nav-group').forEach(function(g){g.classList.toggle('current',!!cur&&g.getAttribute('data-sec')===cur.sec);});
    all('.topnav a').forEach(function(a){if(cur&&a.getAttribute('data-sec')===cur.sec)a.setAttribute('aria-current','true');else a.removeAttribute('aria-current');});
    document.title=cur?cur.title+' | Kasane':'Kasane ドキュメント';

    /* pager */
    var i=FLAT.indexOf(cur),h='';
    if(cur){
      if(i>0)h+='<a class="prev" href="#'+FLAT[i-1].id+'"><small>前のページ</small>'+FLAT[i-1].title+'</a>';
      if(i<FLAT.length-1)h+='<a class="next" href="#'+FLAT[i+1].id+'"><small>次のページ</small>'+FLAT[i+1].title+'</a>';
    }
    $('pager').innerHTML=h;$('pager').hidden=!h;

    /* on this page */
    var page=document.querySelector('.page:not([hidden])');
    tocSecs=cur?all('.sec',page):[];
    $('toc').innerHTML=tocSecs.length?'<div class="toc-title">このページの内容</div>':'';
    tocBtns=tocSecs.map(function(s){
      var b=document.createElement('button');b.type='button';b.textContent=s.querySelector('h2').textContent;
      b.addEventListener('click',function(){s.scrollIntoView({block:'start'});});
      $('toc').appendChild(b);return b;});
    setDrawer(false);
    window.scrollTo(0,0);
    paintTokens();spy();
  }
  function spy(){
    if(!tocSecs.length)return;
    var cur=0;tocSecs.forEach(function(s,i){if(s.getBoundingClientRect().top<=140)cur=i;});
    if(window.innerHeight+window.scrollY>=document.documentElement.scrollHeight-4&&tocSecs[tocSecs.length-1].getBoundingClientRect().top<window.innerHeight)cur=tocSecs.length-1;
    tocBtns.forEach(function(b,i){if(i===cur)b.setAttribute('aria-current','true');else b.removeAttribute('aria-current');});
  }
  var ticking=false;
  window.addEventListener('scroll',function(){if(!ticking){ticking=true;requestAnimationFrame(function(){spy();ticking=false;});}},{passive:true});
  window.addEventListener('hashchange',route);
  document.addEventListener('click',function(e){
    var s=e.target.closest('[data-scroll]');
    if(s){var el=$(s.getAttribute('data-scroll'));if(el)el.scrollIntoView({block:'start'});}
  });

  /* ---------- Drawer (mobile) ---------- */
  var side=$('sidebar'),menu=$('menu-btn'),dscrim=$('drawer-scrim');
  function setDrawer(open){
    side.classList.toggle('open',open);dscrim.hidden=!open;
    menu.setAttribute('aria-expanded',String(open));menu.setAttribute('aria-label',open?'メニューを閉じる':'メニューを開く');
  }
  menu.addEventListener('click',function(){var o=!side.classList.contains('open');setDrawer(o);if(o){var f=side.querySelector('a');if(f)f.focus();}});
  dscrim.addEventListener('click',function(){setDrawer(false);});

  /* ---------- Accent palette ---------- */
  function currentAccent(){return root.dataset.accent||'yamabuki';}
  function setAccent(id,save){
    root.dataset.accent=id;if(save)store.set('kasane-accent',id);
    all('[data-accent-set]').forEach(function(b){b.setAttribute('aria-pressed',String(b.getAttribute('data-accent-set')===id));});
    paintTokens();
  }
  function paintTokens(){
    var cs=getComputedStyle(root);
    all('[data-token]').forEach(function(el){el.textContent=cs.getPropertyValue(el.getAttribute('data-token')).trim();});
  }
  var chooser=$('chooser'),opener=null;
  function openChooser(from){
    opener=from||null;chooser.hidden=false;
    var sel=chooser.querySelector('[aria-pressed="true"]')||chooser.querySelector('.pal');sel.focus();
  }
  function closeChooser(){chooser.hidden=true;store.set('kasane-accent',currentAccent());if(opener)opener.focus();}
  document.addEventListener('click',function(e){
    var p=e.target.closest('[data-accent-set]');
    if(p){setAccent(p.getAttribute('data-accent-set'),chooser.hidden);return;}
    var o=e.target.closest('[data-open-chooser]');
    if(o)openChooser(o);
  });
  $('chooser-ok').addEventListener('click',closeChooser);
  chooser.addEventListener('click',function(e){if(e.target===chooser)closeChooser();});
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){if(!chooser.hidden)closeChooser();else if(side.classList.contains('open')){setDrawer(false);menu.focus();}}
    if(e.key==='Tab'&&!chooser.hidden){
      var f=all('button',chooser),first=f[0],last=f[f.length-1];
      if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
      else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
    }
  });

  /* ---------- Theme switch (light / dark; default follows the device) ---------- */
  var mq=window.matchMedia('(prefers-color-scheme: dark)'),themeBtns=all('[data-theme-set]');
  function isDark(){var t=root.dataset.theme;return t?t==='dark':mq.matches;}
  function paintTheme(){var cur=isDark()?'dark':'light';themeBtns.forEach(function(b){b.setAttribute('aria-pressed',String(b.getAttribute('data-theme-set')===cur));});paintTokens();}
  themeBtns.forEach(function(b){b.addEventListener('click',function(){var v=b.getAttribute('data-theme-set');root.dataset.theme=v;store.set('kasane-theme',v);paintTheme();});});
  try{mq.addEventListener('change',paintTheme);}catch(e){}

  /* ---------- Tabs in the examples ---------- */
  all('[role="tablist"]').forEach(function(list){
    var tabs=all('[role="tab"]',list);
    function select(tab){tabs.forEach(function(x){var on=x===tab;x.setAttribute('aria-selected',String(on));x.tabIndex=on?0:-1;$(x.getAttribute('aria-controls')).hidden=!on;});}
    tabs.forEach(function(tab,i){
      tab.addEventListener('click',function(){select(tab);});
      tab.addEventListener('keydown',function(e){var d=e.key==='ArrowRight'?1:e.key==='ArrowLeft'?-1:0;if(!d)return;var n=tabs[(i+d+tabs.length)%tabs.length];select(n);n.focus();});
    });
  });

  /* ---------- Pressed-style segmented controls in the examples ---------- */
  document.addEventListener('click',function(e){
    var b=e.target.closest('.ex-demo .k-seg[role="group"] button');if(!b)return;
    all('button',b.parentNode).forEach(function(x){x.setAttribute('aria-pressed',String(x===b));});
  });

  /* ---------- Replay a motion example ---------- */
  document.addEventListener('click',function(e){
    var b=e.target.closest('[data-replay]');if(!b)return;
    var el=$(b.getAttribute('data-replay'));el.classList.remove('k-enter');void el.offsetWidth;el.classList.add('k-enter');
  });

  /* ---------- Live dialog example ---------- */
  var demoDlg=$('demo-dialog'),demoFrom=null;
  function closeDemo(){if(demoDlg.hidden)return;demoDlg.hidden=true;if(demoFrom)demoFrom.focus();}
  document.addEventListener('click',function(e){
    var o=e.target.closest('[data-open-demo]');
    if(o){demoFrom=o;demoDlg.hidden=false;demoDlg.querySelector('button').focus();return;}
    if(e.target.closest('[data-close-demo]')||e.target===demoDlg)closeDemo();
  });
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeDemo();});

  /* ---------- Copy buttons ---------- */
  document.addEventListener('click',function(e){
    var b=e.target.closest('.copy');if(!b)return;
    var text=b.closest('.code').querySelector('pre').textContent;
    var done=function(ok){b.textContent=ok?'コピーしました':'コピーできませんでした';setTimeout(function(){b.textContent='コピー';},1800);};
    try{navigator.clipboard.writeText(text).then(function(){done(true);},function(){done(false);});}catch(err){done(false);}
  });

  /* ---------- Start ---------- */
  setAccent(currentAccent(),false);
  paintTheme();
  route();
  if(!store.get('kasane-accent'))openChooser(null);
})();
</script>
</body>
</html>
