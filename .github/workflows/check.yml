name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      # Rebuild from the sources and fail if the committed files are out of date.
      - run: npm run build
      - run: git diff --exit-code -- v1 index.html llms.txt lint/data
      # Lint rules work, and every palette meets the contrast rules.
      - run: npm test
